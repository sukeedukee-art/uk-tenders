name: Daily tender refresh
on:
  schedule:
    - cron: "0 6 * * *"   # every day 06:00 UTC
  workflow_dispatch: {}    # manual "Run workflow" button
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Scrape tenders
        env:
          TED_API_KEY: ${{ secrets.TED_API_KEY }}
        run: python tender_scraper.py

      - name: Commit results
        run: |
          git config user.name "tender-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tenders.json
          git diff --cached --quiet || git commit -m "Update tenders $(date -u +%F)"
          git push

      - name: Send Slack / Teams alerts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DASHBOARD_URL:     ${{ secrets.DASHBOARD_URL }}
        run: python send_alerts.py
