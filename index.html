<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UK Tender Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mu:#66707c;--bd:#e2e5ea;--ac:#1d5fd1;--nw:#0e9f6e;--wr:#d9480f}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1e24;--tx:#e8eaed;--mu:#94a0ad;--bd:#2b313a;--ac:#5b9bff;--nw:#05875d;--wr:#b83c0c}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:20px 24px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{margin:0;font-size:20px}.sub{color:var(--mu);font-size:13px}
.stats{display:flex;gap:12px;padding:16px 24px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 16px;min-width:130px}
.stat b{font-size:22px;display:block}.stat span{color:var(--mu);font-size:12px}
.bar{display:flex;gap:8px;padding:0 24px 12px;flex-wrap:wrap;align-items:center}
input,select{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
input{flex:1;min-width:200px}
.chip{padding:6px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:0 24px 40px;display:grid;gap:10px}
.t{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px}
.t h3{margin:0 0 4px;font-size:16px}.t h3 a{color:var(--ac);text-decoration:none}
.meta{color:var(--mu);font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
.d{margin:8px 0 0;font-size:13.5px;color:var(--mu)}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--bd);margin-right:4px}
.new{background:var(--nw);color:#fff;border-color:var(--nw)}.soon{color:var(--wr);font-weight:600}
</style>
</head>
<body>
<header><h1>UK Live Tenders</h1><div class="sub" id="gen">Loading…</div></header>
<div class="stats" id="stats"></div>
<div class="bar"><input id="q" placeholder="Search title, buyer, description…">
<select id="sort"><option value="deadline">Closing soonest</option><option value="new">Newest first</option><option value="value">Highest value</option></select></div>
<div class="bar" id="chips"></div>
<main id="list"></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let all=[],cat="All";
const day=86400000,gbp=v=>v?"£"+Number(v).toLocaleString("en-GB",{maximumFractionDigits:0}):"Value n/a";
const daysLeft=d=>d?Math.ceil((new Date(d)-Date.now())/day):null;
fetch("tenders.json?"+Date.now()).then(r=>r.json()).then(j=>{
 all=j.tenders;$("gen").textContent="Last updated "+new Date(j.generated).toLocaleString("en-GB");
 const cats=["All",...new Set(all.flatMap(t=>t.categories))];
 $("chips").innerHTML=cats.map(c=>`<button class="chip ${c==="All"?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
 $("chips").onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;[...$("chips").children].forEach(b=>b.classList.toggle("on",b.dataset.c===cat));render()}};
 render();
}).catch(()=>$("gen").textContent="Could not load tenders.json");
$("q").oninput=render;$("sort").onchange=render;
function render(){
 const q=$("q").value.toLowerCase(),s=$("sort").value;
 let l=all.filter(t=>(cat==="All"||t.categories.includes(cat))&&(`${t.title} ${t.buyer} ${t.description}`).toLowerCase().includes(q));
 l.sort((a,b)=>s==="new"?(b.first_seen||"").localeCompare(a.first_seen||""):s==="value"?(b.value||0)-(a.value||0):(a.deadline||"9").localeCompare(b.deadline||"9"));
 const isNew=t=>Date.now()-new Date(t.first_seen)<2*day;
 $("stats").innerHTML=[["Live tenders",all.length],["New (48h)",all.filter(isNew).length],["Closing in 7 days",all.filter(t=>{const d=daysLeft(t.deadline);return d!==null&&d<=7}).length],["Showing",l.length]]
  .map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
 $("list").innerHTML=l.map(t=>{const d=daysLeft(t.deadline);
  return `<div class="t"><h3><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a></h3>
  <div class="meta"><span>${esc(t.buyer)}</span><span>${gbp(t.value)}</span>
  <span class="${d!==null&&d<=7?"soon":""}">${t.deadline?"Closes "+new Date(t.deadline).toLocaleDateString("en-GB")+" ("+d+"d)":"No deadline"}</span><span>${esc(t.source)}</span></div>
  <div style="margin-top:6px">${isNew(t)?'<span class="tag new">NEW</span>':""}${t.categories.map(c=>`<span class="tag">${esc(c)}</span>`).join("")}</div>
  <p class="d">${esc(t.description.slice(0,280))}${t.description.length>280?"…":""}</p></div>`}).join("")||"<p>No tenders match.</p>";
}
</script>
</body>
</html>
